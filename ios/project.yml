name: LocalArena
options:
  bundleIdPrefix: com.localarena
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  LocalArena:
    type: application
    platform: iOS
    sources:
      - LocalArena
      - Generated/local_arena_ffi.swift
    resources:
      - path: LocalArena/TestData
        buildPhase: resources
    info:
      path: LocalArena/Info.plist
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.localarena.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: ["-lsqlite3"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated"]
    dependencies:
      - framework: LocalArenaCore.xcframework
        embed: false
