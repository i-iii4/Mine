<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <!-- The page background before the stylesheet lands. It repeats the
         theme's own --background values so the first paint and every later
         paint are the same colour: a hard-coded hex here used to differ from
         the token and showed up as a lighter page behind the app. -->
    <style>
      :root { color-scheme: light dark; }
      html, body { background: oklch(1 0 0); }
      @media (prefers-color-scheme: dark) {
        html, body { background: oklch(0.14 0 0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/settings/main.tsx"></script>
  </body>
</html>
