name: Tests

# The everyday contract on every push and pull request: lint, the Rust to
# TypeScript bindings, the frontend and clipper tests, the Rust workspace tests
# (SPEC_AUDIT_FIXES.md, А10.3). Browser gates stay local by decision of
# 29.09.2026; the packaged app has its own smoke workflow.

on:
  pull_request:
  push:
    branches: [main, audit-remediation]

permissions:
  contents: read

jobs:
  checks:
    # macOS: the build compiles the Swift helpers with swiftc, and the watcher
    # tests exercise the real FSEvents.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The coverage gate compares the pushed range, which needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The frontend tests run the real save core compiled to WebAssembly and
      # bound with this exact tool version (scripts/build-save-core.mjs
      # refuses any other).
      - name: Install the matching WebAssembly binding tool
        run: cargo install wasm-bindgen-cli --version 0.2.120 --locked --no-default-features --bin wasm-bindgen
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The clipper payload is a bundle resource the build script checks for.
      # Tests never package it, so the directory only has to exist.
      - name: Provide the clipper payload directory
        run: mkdir -p build/clipper-extension
      # Every changed behavior file names a requirement and a check. After a
      # push the automatic base is HEAD itself, so the pushed range is passed
      # explicitly (SPEC_AUDIT_FIXES.md, Б6.3). A new branch has no previous
      # revision and is compared with main.
      - name: Changed behavior has a requirement and a check
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PULL_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=origin/main
          fi
          node scripts/reliability-gate.mjs --base "$base"
          node --test scripts/reliability-gate.test.mjs
      - name: Lint
        run: bun run lint
      - name: Bindings match the Rust contract
        run: bun run bindings:check
      - name: Frontend and clipper tests
        run: bun run test:frontend
      - name: Rust workspace tests
        run: bun run test:rust
