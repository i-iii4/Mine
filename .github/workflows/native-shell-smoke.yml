name: Native shell smoke

on:
  pull_request:
  push:
    branches: [main, audit-remediation]

permissions:
  contents: read

jobs:
  macos-wkwebview:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The bundle's clipper payload embeds the portable save core, built to
      # WebAssembly and bound with this exact tool version
      # (scripts/build-save-core.mjs refuses any other).
      - name: Install the matching WebAssembly binding tool
        run: cargo install wasm-bindgen-cli --version 0.2.120 --locked --no-default-features --bin wasm-bindgen
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Launch the bundled app and verify WebView to Rust IPC
        run: bun run test:native-shell
