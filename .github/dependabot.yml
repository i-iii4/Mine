version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Argentina/Buenos_Aires
    allow:
      - dependency-name: shadcn
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(shadcn)"
