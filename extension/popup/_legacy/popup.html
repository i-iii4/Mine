<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Arena Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Error state -->
    <div id="error-state" class="state hidden">
      <div class="error-icon">!</div>
      <p id="error-message"></p>
    </div>

    <!-- Main form -->
    <div id="main-state" class="state hidden">
      <!-- Compact preview card (thumbnail + title + domain) -->
      <div id="preview-card" class="preview-card">
        <img id="preview-thumb" class="preview-thumb hidden" alt="">
        <div class="preview-info">
          <input type="text" id="title-input" class="preview-title" placeholder="Title">
          <span id="preview-domain" class="preview-domain"></span>
        </div>
      </div>

      <!-- Full-width image preview (for image type only) -->
      <div id="image-preview" class="image-preview hidden">
        <img id="image-preview-img" alt="">
      </div>

      <!-- Type switcher: Content | Link -->
      <div id="type-switcher" class="type-switcher hidden"></div>

      <!-- Text preview (for content type) -->
      <p id="preview-text" class="preview-text hidden"></p>

      <!-- Channels section -->
      <div class="channels-section">
        <input type="text" id="channel-search" class="channel-search" placeholder="Search channels...">
        <div class="channels-header">
          <span id="channels-label">Recent</span>
        </div>
        <div id="channel-list" class="channel-list"></div>
      </div>

      <!-- Save button (full width) -->
      <button id="save-btn" class="save-btn">
        <span id="save-label">Save</span>
        <span id="save-spinner" class="spinner hidden"></span>
        <kbd>&#8984;&#9166;</kbd>
      </button>

      <!-- Status -->
      <div id="status-bar" class="status-bar hidden">
        <span id="status-text"></span>
      </div>
    </div>

    <!-- Loading state -->
    <div id="loading-state" class="state">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
