[package]
name = "mine-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Portable Mine document rules and save decisions"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
percent-encoding = "2"
sha2 = "0.10"
whatlang = "0.16"
unicode-normalization = "0.1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.120"

[dev-dependencies]
indoc = "2"
