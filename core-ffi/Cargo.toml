[package]
name = "local-arena-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "local_arena_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen/main.rs"

[dependencies]
local-arena = { path = "../src-tauri" }
uniffi = "0.29"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
