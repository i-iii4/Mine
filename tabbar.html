<!doctype html>
<html lang="en" data-tab-bar-page>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs</title>
    <!-- The page background before the stylesheet lands. The bar is one
         surface, the bottom panel's accent, so it repeats the theme's own
         --accent values: the first paint and every later paint are the same
         colour. -->
    <style>
      :root { color-scheme: light dark; }
      html, body { background: oklch(0.98 0 0); }
      @media (prefers-color-scheme: dark) {
        html, body { background: oklch(0.2 0 0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tabbar/main.tsx"></script>
  </body>
</html>
