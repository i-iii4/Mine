[package]
name = "mine"
version = "0.1.0"
description = "Local-first alternative to Are.na for visual bookmarking"
authors = ["i_iii"]
license = "MIT"
repository = "https://github.com/i-iii4/mine"
edition = "2021"
rust-version = "1.88"
default-run = "mine"

[lib]
name = "mine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["tauri", "tauri-plugin-log", "tauri-plugin-dialog", "tauri-plugin-opener", "tauri-build", "notify"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# Tauri (desktop only)
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.33", features = ["bundled"] }

# File system
notify = { version = "8", optional = true }

# HTTP client (for Are.na import)
ureq = { version = "2", features = ["json"] }
url = "2"

# Image processing
image = "0.25"
ab_glyph = "0.2"
imageproc = "0.25"

# Video frame extraction (MP4/H.264 thumbnail generation)
mp4 = "0.14"

# Base64 (data URL decoding for screenshots)
base64 = "0.22"

# HTTP server for binary file uploads from extension
tiny_http = "0.12"
http-range = "0.1"
percent-encoding = "2"
getrandom = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
whatlang = "0.16"

# Unicode NFC normalization for filename/slug identity consistency across
# HFS+ (NFD) and APFS (NFC) file systems. Required at every filesystem
# boundary — see SPEC_STORAGE.md and Phase 18.A in PLAN.md.
unicode-normalization = "0.1"

# Logging
log = "0.4"

# Type generation for TypeScript
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
specta-typescript = "=0.0.9"

# OS trash (not available on iOS)
[target.'cfg(not(target_os = "ios"))'.dependencies]
trash = "5"
openh264 = "0.6"
fastembed = "5"

[[bin]]
name = "native-host"
path = "src/bin/native_host.rs"

[[bin]]
name = "migrate-body-to-wikilinks"
path = "src/bin/migrate_body_to_wikilinks.rs"

[[bin]]
name = "migrate-collections-to-wikilinks"
path = "src/bin/migrate_collections_to_wikilinks.rs"

[[bin]]
name = "migrate-primary-file-to-wikilinks"
path = "src/bin/migrate_primary_file_to_wikilinks.rs"

[[bin]]
name = "localize-remote-media"
path = "src/bin/localize_remote_media.rs"

[[bin]]
name = "cold-space-audit"
path = "src/bin/cold_space_audit.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[dev-dependencies]
indoc = "2"
tempfile = "3"

# custom-protocol is in [features] at top
